name: Offline baseline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-test dependencies
        run: Rscript -e 'install.packages(c("data.table", "mgcv", "glmnet"), repos="https://cloud.r-project.org")'
      - name: Check preserved source and offline tests
        run: python3 scripts/check.py
      - name: Run synthetic decision example
        run: Rscript examples/decision_score_demo.R
